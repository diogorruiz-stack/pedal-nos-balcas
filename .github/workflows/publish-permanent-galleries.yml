name: Publish permanent galleries
on:
  push:
    branches: [main]
    paths: ['gallery-recovery-part-1.zip', 'gallery-recovery-part-2.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract recovered JPGs and catalog
        run: |
          test -f gallery-recovery-part-1.zip
          test -f gallery-recovery-part-2.zip
          unzip -o gallery-recovery-part-1.zip -d .
          unzip -o gallery-recovery-part-2.zip -d .
      - name: Validate files and build permanent catalog
        run: node scripts/install-permanent-gallery.js
      - name: Validate expected counts
        run: |
          test "$(find public/imagens/dia-07 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 23
          test "$(find public/imagens/dia-10 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 23
          test "$(find public/imagens/dia-11 -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 17
          grep -q 'photos-fixed-local.js' index.html
      - name: Commit gallery assets and remove uploaded archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm gallery-recovery-part-1.zip gallery-recovery-part-2.zip
          git add -A public/imagens/dia-07 public/imagens/dia-10 public/imagens/dia-11 dados/catalogo-definitivo.json photos-fixed-local.js gallery-recovery-part-1.zip gallery-recovery-part-2.zip
          git commit -m "Publish 63 permanent gallery images for days 7 10 11"
          git pull --rebase origin main
          git push origin main
