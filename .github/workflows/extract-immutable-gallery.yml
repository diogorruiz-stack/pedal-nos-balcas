name: Extract permanent gallery assets
on:
  push:
    branches: [static-gallery-rebuild]
    paths:
      - '.github/workflows/extract-immutable-gallery.yml'
      - 'scripts/extract-embedded-gallery.js'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-gallery-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/extract-embedded-gallery.js
      - name: Commit extracted permanent photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/imagens dados/fotografias-recuperadas.json dados/relatorio-recuperacao.json
          if ! git diff --cached --quiet; then
            git commit -m 'Extract embedded photographs as permanent site assets'
            git push origin HEAD:static-gallery-rebuild
          fi
